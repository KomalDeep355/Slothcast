[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothcast"
version = "0.1.0"
description = "Local-first deadline-risk forecaster: TabPFN predicts, a local Gemma plans, you stay lazy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "requests>=2.31",
  "streamlit>=1.30",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
tabpfn = ["tabpfn>=9.0.0"]
temporal = ["temporalio>=1.5"]
sentry = ["sentry-sdk>=2.0"]
dev = ["pytest>=7.4"]

[project.scripts]
slothcast = "slothcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
